[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowlight"
version = "0.1.0"
description = "Low-light image enhancement, and an honest account of what it recovers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luis Manuel Barrios Núñez" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplification, C4 comprehensions, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long, descriptive test names are the point.
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
